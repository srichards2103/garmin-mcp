[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin-training-mcp"
version = "0.1.0"
description = "Read-only Garmin Connect health and activity tools for MCP clients"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["garminconnect==0.3.11", "fastmcp==4.0.3"]

[project.scripts]
garmin-mcp = "garmin_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
